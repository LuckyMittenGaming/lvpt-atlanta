name: Apply Atlanta Review Fixes

on:
  push:
    branches:
      - main
    paths:
      - tools/apply_atlanta_review_fixes.py
      - .github/workflows/apply-atlanta-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fixes
        run: python tools/apply_atlanta_review_fixes.py
