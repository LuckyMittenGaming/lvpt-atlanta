name: Generate Atlanta City Page

on:
  push:
    branches:
      - main
    paths:
      - tools/generate_atlanta_page.py
      - .github/workflows/generate-atlanta-page.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Atlanta page
        run: python tools/generate_atlanta_page.py
