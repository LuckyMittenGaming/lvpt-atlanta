name: Fix Atlanta Leftovers

on:
  push:
    branches:
      - main
    paths:
      - tools/fix_atlanta_leftovers.py
      - .github/workflows/fix-atlanta-leftovers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final cleanup
        run: python tools/fix_atlanta_leftovers.py
